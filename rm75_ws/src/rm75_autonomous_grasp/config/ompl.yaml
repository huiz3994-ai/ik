planner_configs:
  RRTConnect:
    type: geometric::RRTConnect
    range: 0.2
  RRTstar:
    type: geometric::RRTstar
    range: 0.2
    goal_bias: 0.2
    delay_collision_checking: 1
  PRM:
    type: geometric::PRM
    max_nearest_neighbors: 10
  KPIECE:
    type: geometric::KPIECE
    range: 0.2
    goal_bias: 0.1
    border_fraction: 0.9
    failed_expansion_score_factor: 0.5
    min_valid_path_fraction: 0.5
  EST:
    type: geometric::EST
    range: 0.2
    goal_bias: 0.1
arm:
  default_planner_config: RRTConnect
  planner_configs: [RRTConnect, RRTstar, PRM, KPIECE, EST]
  projection_evaluator: joints(joint1,joint2,joint4)
  longest_valid_segment_fraction: 0.0005
  enforce_joint_model_state_space: true
